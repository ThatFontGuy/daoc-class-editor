name: Release

# Builds macOS (both Apple Silicon and Intel), Windows, and Linux installers and attaches them to
# a GitHub Release - triggered by pushing a `vX.Y.Z` tag (see `release-tools/cut-release.sh`,
# maintainer-only tooling not committed to this repo - see this workflow's own `macOS signing`
# step below for why) or manually via "Run workflow" in the Actions tab.
#
# macOS builds are code-signed and notarized if this repository's own `APPLE_CERTIFICATE` secret
# is set (see README's own "Cutting a release" section for how a maintainer sets this up) -
# otherwise they still build successfully, just ad-hoc signed (Apple's own `-` pseudo-identity),
# so a fork of this repo without those secrets configured still gets a usable, if unsigned,
# macOS build out of this same workflow unmodified.
#
# Windows/Linux builds are never code-signed here at all (no certificate for either exists for
# this project) - an unsigned .msi/.exe shows Windows' own "unknown publisher" SmartScreen prompt
# on first run, expected and harmless for a small, non-commercial tool like this one.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    # Secrets can't be referenced directly in a step's own `if:` condition (GitHub Actions'
    # own restriction) - mapped to plain job-level env vars here instead, just so the two
    # macOS-only signing steps below can cleanly no-op on a fork with neither secret set,
    # rather than failing outright trying to import an empty certificate.
    env:
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Only macOS needs both architectures explicitly listed - the matrix's own `args`
          # already picks one target per macOS job, but the toolchain itself needs both installed
          # up front since this same step runs before that distinction matters.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Import Apple Developer certificate (macOS only, skipped on a fork with no secret set)
        if: matrix.platform == 'macos-latest' && env.HAS_APPLE_CERTIFICATE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Write Apple API key file (macOS only, needed for notarization)
        if: matrix.platform == 'macos-latest' && env.HAS_APPLE_API_KEY == 'true'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "${{ runner.temp }}/apple_api_key.p8"

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple_api_key.p8
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DAoC Class Editor ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
