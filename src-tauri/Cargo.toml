[package]
name = "daoc-class-editor"
version = "0.1.0"
description = "Clone existing Dark Age of Camelot classes into new custom classes and deploy them to a running Offline DAoC server."
authors = ["ThatFontGuy"]
edition = "2024"
# Required once a second binary target existed (src/bin/export_charplanner.rs) - a real build
# break found live: `tauri build` failed outright ("failed to find main binary") without this,
# since it can no longer infer which binary is "the app" on its own with two to choose from.
# Points at this package's own main entry point (src/main.rs), never export_charplanner.
default-run = "daoc-class-editor"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "daoc_class_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
walkdir = "2"
dirs = "5"
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
